- title: "Families of Two-Impulse Optimal Rendezvous Transfers Between Elliptic Orbits"
  authors: "Park, B., Howell, K. C., <u><b>Kim, J.</b></u>, and Ahn, J."
  venue: "The Journal of the Astronautical Sciences, Vol. 73, No. 5"
  year: 2026
  type: "journal"
  link: "https://doi.org/10.1007/s40295-026-00624-9"
  summary: "This paper revisits the classical fuel-optimal two-impulse rendezvous problem between Keplerian orbits from a family-based perspective. The framework applies selected first-order optimality conditions and numerical continuation to connect isolated optima into continuous one-parameter families. These families are classified using Hessian-based criteria and Primer Vector Theory and projected onto porkchop plots. Case studies show how locally optimal branches emerge, merge, and disappear with orbital geometry, providing a global map of solution robustness and near-optimal alternatives."
  detail_image: "/assets/img/overview-park-2026-families.png"

- title: "On-Orbit Servicing-Integrated Maintenance Strategy for Satellite Constellation"
  authors: "<b>Kim, J.</b>, Sung, T., Hwang, W., and <u>Ahn, J.</u>"
  venue: "Journal of Spacecraft and Rockets (Online Published)"
  type: "journal"
  link: "https://doi.org/10.2514/1.A36684"
  summary: "This paper proposes an on-orbit servicing (OOS)-integrated maintenance strategy for satellite constellations that combines new satellite deployment with OOS-based recovery of failed satellites. An inventory management model with a parametric replenishment policy is developed to evaluate maintenance performance and formulate the operator-provider interaction as a bi-objective optimization problem: the operator minimizes cost while maintaining service levels, whereas the OOS provider maximizes profit through pricing and performance decisions. A real-world-scale case study shows that the Pareto frontier is driven primarily by provider pricing, while the operator's maintenance strategy remains nearly invariant. Among OOS-related parameters, the recoverable failure fraction has the strongest structural effect."
  detail_image: "/assets/img/overview-kim-2026-orbit.png"

- title: "System Architecting for GEO Communication Satellite Considering On-Orbit Refueling"
  authors: "<b>Kim, J.</b> and <u>Ahn, J.</u>"
  venue: "Journal of Spacecraft and Rockets, Vol. 63, No. 1"
  year: 2026
  type: "journal"
  link: "https://doi.org/10.2514/1.A36403"
  summary: "This paper addresses satellite system architecture selection under commercial on-orbit refueling (OOR), focusing on two design parameters: design lifetime and initial propellant loading. The problem is formulated as a mathematical optimization, with design lifetime and initial propellant mass as design variables and two objectives balancing monetary return and risk. To solve it, we develop a surrogate-model-based framework grounded in satellite lifecycle simulation, incorporating uncertainty, operational flexibility, and modified sizing and cost models for OOR-enabled systems. A GEO communication satellite case study evaluates current service-performance targets and explores alternative architectures beyond traditional design trends."
  detail_image: "/assets/img/overview-kim-2026-system.png"

- title: "Mathematical Programming-Based Design Structure Matrix Clustering for Optimal Modular Architecture Design"
  authors: "<b>Kim, J.</b>, Choi, E., <u>Ahn, J.</u>, Suh, E. S., Kim, J.-H., and Lim, D. G."
  venue: "Journal of Mechanical Design, Vol. 147, No. 10"
  year: 2025
  type: "journal"
  link: "https://doi.org/10.1115/1.4068100"
  summary: "This paper introduces a mixed-integer linear programming (MILP) approach to modular architecture design based on the design structure matrix (DSM). The DSM modularization problem seeks to maximize modularity, quantified by the (Q)-metric, while satisfying constraints that reflect practical considerations across the system life cycle. The proposed formulation is verified through two case studies involving automobile and electric train subsystems, demonstrating its effectiveness and practical applicability."
  detail_image: "/assets/img/overview-kim-2025-mathematical.png"

- title: "Replenishment Strategy for Satellite Constellation with Dual Supply Modes"
  authors: "<b>Kim, J.</b>, Ahn, J., and <u>Sung, T.</u>"
  venue: "Journal of Spacecraft and Rockets, Vol. 62, No. 5"
  year: 2025
  type: "journal"
  link: "https://doi.org/10.2514/1.A36281"
  summary: "This paper proposes a replenishment strategy for satellite mega-constellations using primary and auxiliary supply modes. The primary mode uses an indirect channel, placing spare satellites in a parking orbit before transferring them to target orbital planes via onboard propulsion, whereas the auxiliary mode directly injects spares into their designated planes. An inventory management model with time-window-based parametric replenishment policies is developed, and optimization problems are formulated from the perspectives of the constellation operator and launch service provider. A case study shows that the effectiveness of the direct channel is context-dependent and reveals the operational tension between the small-launch provider and the mega-constellation operator."
  detail_image: "/assets/img/overview-kim-2025-replenishment.png"

- title: "Simultaneous Optimization of Launch Vehicle Stage and Trajectory Considering Flight-Requirement Constraints"
  authors: "Ko, J., <b>Kim, J.</b>, Choi, J., and <u>Ahn, J.</u>"
  venue: "International Journal of Aeronautical and Space Sciences, Vol. 25"
  year: 2024
  type: "journal"
  link: "https://doi.org/10.1007/s42405-024-00737-1"
  summary: "Conceptual design of launch vehicle involves multiple disciplines, including structures, aerodynamics, propulsion, flight control, and stage sizing. This paper focuses on the integrated optimization of trajectory and stage sizing. Conventional approaches often treat these tasks sequentially, which can increase computational complexity and yield suboptimal designs. The proposed framework minimizes lift-off mass while satisfying flight requirements, including limits on maximum dynamic pressure and impact points of separated parts. A case study demonstrates the advantage of the integrated framework over the conventional sequential optimization approach."
  detail_image: "/assets/img/overview-ko-2024-simultaneous.png"

- title: "Korean Space Collision Environment Assessment Framework Based on 3D-Cell Model"
  authors: "<b>Kim, J.</b>, Song, M., Lee, J., Yu, J., Choi, E. J., Kam, H., Jo, J., and <u>Ahn, J.</u>"
  venue: "revised manuscript submitted at International Journal of Aeronautical and Space Sciences"
  type: "journal"
  link: "https://doi.org/10.48550/arXiv.2608.22877"
  summary: "Space situational awareness (SSA) capabilities are becoming increasingly critical as access to space expands and space activities intensify. SSA supports operations, planning, and strategic and political decision-making worldwide. This paper introduces the baseline model and implementation details of the developed software. It also presents the results and implications of numerical studies focused on low Earth orbit. These studies analyze the effects of key input parameters and investigate the evolution of the space collision environment, providing insights for parameter selection and demonstrating the applicability of the developed software."
  detail_image: "/assets/img/overview-kim-2026-korean.png"

- title: "Multi-Domain Matrix Framework for Human Resource Decision Support"
  authors: "Lee, D., <u><b>Kim, J.</b></u>, and Ahn, J."
  venue: "under review at Systems Engineering"
  type: "journal"
  link: "https://doi.org/10.48550/arXiv.2607.01613"
  summary: "This paper presents an actionable human resource (HR) decision-support framework for small firms and startups based on a multi-domain matrix (MDM). The framework addresses complex interdependencies among members, skills, and projects by formulating startup HR management as a multi-domain structural modeling problem. It provides qualitative guidelines and quantitative metrics for diagnosing HR states and supporting decisions on workload redistribution, hiring, and capability development. A case study of an early-stage technology startup demonstrates that the framework identifies workload imbalances, detects unsustainable member workloads, and informs hiring decisions while supporting continuous HR diagnosis after organizational changes."
  detail_image: "/assets/img/overview-lee-2026-multi.png"

- title: "Optimal Design Structure Matrix Clustering with Constraint Selections for Conflict Resolution"
  authors: "Choi, E., <b>Kim, J.</b>, Kim, J.-H., Suh, E. S., and <u>Ahn, J.</u>"
  venue: "under review at Journal of Mechanical Design"
  type: "journal"
  summary: "This paper introduces an optimal clustering method for a design structure matrix (DSM) with constraints selection. In DSM clustering problems, constraints may conflict with one another, making it impossible to obtain a feasible solution, as illustrated in the figure. The proposed approach addresses such cases by simultaneously determining an optimal modular design that maximizes the modularity metric, (Q), while minimizing constraint violations according to their priorities and weights. A case study of an automobile suspension system demonstrates the effectiveness of the method in achieving high-quality clustering while resolving constraint conflicts."
  detail_image: "/assets/img/overview-choi-2026-optimal.png"

