<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=20260703-back-to-top' | relative_url }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>
<body>

    <div class="container">
        <header class="masthead">
            <h3 class="masthead-title">
                <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
            </h3>
            <nav class="nav-links">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/research' | relative_url }}">Research</a>
                <a href="{{ '/publications' | relative_url }}">Publications</a>
                <a href="{{ '/cv' | relative_url }}">CV</a>
            </nav>
        </header>

        <main class="content">
            {{ content }}
        </main>

        <footer class="footer">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. All rights reserved.</p>
        </footer>
    </div>

    <div class="figure-modal" id="figure-modal" aria-hidden="true">
        <div class="figure-modal-backdrop" data-close-figure-modal></div>
        <div class="figure-modal-panel" role="dialog" aria-modal="true" aria-label="Publication figure">
            <button type="button" class="figure-modal-close" data-close-figure-modal aria-label="Close">&times;</button>
            <div class="figure-modal-content"></div>
        </div>
    </div>

    <button type="button" class="back-to-top" data-back-to-top aria-label="Back to top" title="Back to top" aria-hidden="true" tabindex="-1">
        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 15-6-6-6 6"></path>
        </svg>
    </button>

    <script>
      (function () {
        var modal = document.getElementById('figure-modal');
        if (!modal) return;

        var content = modal.querySelector('.figure-modal-content');
        var closeButtons = modal.querySelectorAll('[data-close-figure-modal]');
        var previousFocus = null;
        var backToTop = document.querySelector('[data-back-to-top]');

        function closeModal() {
          modal.classList.remove('is-open');
          modal.setAttribute('aria-hidden', 'true');
          content.innerHTML = '';
          if (previousFocus) previousFocus.focus();
        }

        function openModal(trigger) {
          previousFocus = trigger;
          content.innerHTML = '';

          if (trigger.dataset.figureSrc) {
            var img = document.createElement('img');
            img.src = trigger.dataset.figureSrc;
            img.alt = trigger.dataset.figureAlt || 'Publication figure';
            content.appendChild(img);
          } else {
            var placeholder = document.createElement('div');
            placeholder.className = 'figure-modal-placeholder';
            content.appendChild(placeholder);
          }

          modal.classList.add('is-open');
          modal.setAttribute('aria-hidden', 'false');
          var closeButton = modal.querySelector('.figure-modal-close');
          if (closeButton) closeButton.focus();
        }

        document.addEventListener('click', function (event) {
          var trigger = event.target.closest('.pub-detail-figure-trigger');
          if (trigger) openModal(trigger);
        });

        closeButtons.forEach(function (button) {
          button.addEventListener('click', closeModal);
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && modal.classList.contains('is-open')) {
            closeModal();
          }
        });

        function openPublicationOverviewFromHash() {
          if (!window.location.hash) return;

          var target = document.getElementById(window.location.hash.slice(1));
          if (!target) return;

          var details = target.querySelector('.pub-detail-toggle');
          if (!details) return;

          details.open = true;
          window.requestAnimationFrame(function () {
            target.scrollIntoView({ block: 'start' });
          });
        }

        openPublicationOverviewFromHash();
        window.addEventListener('hashchange', openPublicationOverviewFromHash);

        function updateBackToTop() {
          if (!backToTop) return;

          var isVisible = window.scrollY > 360;
          backToTop.classList.toggle('is-visible', isVisible);
          backToTop.setAttribute('aria-hidden', isVisible ? 'false' : 'true');
          backToTop.tabIndex = isVisible ? 0 : -1;
        }

        if (backToTop) {
          backToTop.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          window.addEventListener('scroll', updateBackToTop, { passive: true });
          updateBackToTop();
        }
      }());
    </script>

</body>
</html>
